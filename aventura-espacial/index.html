<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081126" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aventura Espacial</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="global-controls" class="global-controls">
      <button id="sound-toggle" class="secondary">🔊 Som ligado</button>
      <button id="fullscreen-toggle" class="secondary">⛶ Tela cheia</button>
      <button id="install-button" class="secondary hidden">⬇ Instalar</button>
    </div>

    <div id="feedback-modal" class="feedback-modal hidden" role="dialog" aria-live="assertive">
      <div class="feedback-card">
        <img id="feedback-image" alt="Feedback" class="hidden" />
        <h2 id="feedback-title"></h2>
        <p id="feedback-text"></p>
      </div>
    </div>

    <audio id="bgm" src="./assets/sounds/musica.mp3" loop preload="auto"></audio>
    <audio id="tic-tac" src="./assets/sounds/tic-tac.mp3" loop preload="auto"></audio>

    <script src="./app.js"></script>
  </body>
</html>
